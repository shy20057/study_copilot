server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: study-copilot-service
  main:
    allow-bean-definition-overriding: false
  datasource:
    url: ${SC_DB_URL}
    username: ${SC_DB_USER}
    password: ${SC_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    schemas: study_copilot
    default-schema: study_copilot
    create-schemas: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${SC_REDIS_HOST:127.0.0.1}
      port: ${SC_REDIS_PORT:6381}
      password: ${SC_REDIS_PASSWORD}
      timeout: 3s
  cache:
    redis:
      time-to-live: 10m
      key-prefix: "${SC_REDIS_PREFIX:study-copilot:}cache:"
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 20MB

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.example.studycopilot.dao.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  issuer: ${JWT_ISSUER:study-copilot}
  secret: ${SC_JWT_SECRET}
  access-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:7200}
  refresh-ttl-seconds: ${JWT_REFRESH_TTL_SECONDS:604800}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized

study-copilot:
  recovery-support-channel: ${SC_RECOVERY_SUPPORT_CHANNEL}
  redis-key-prefix: "${SC_REDIS_PREFIX:study-copilot:}"
  storage:
    endpoint: ${SC_MINIO_ENDPOINT:http://127.0.0.1:9000}
    bucket: ${SC_MINIO_BUCKET:study-copilot}
    access-key: ${SC_MINIO_ACCESS_KEY}
    secret-key: ${SC_MINIO_SECRET_KEY}
